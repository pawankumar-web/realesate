services:
  - type: web
    name: realesate-api
    env: docker
    dockerfilePath: ../docker/php/Dockerfile
    repo: https://github.com/YOUR_USERNAME/realesate
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: YOUR_DB_HOST
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: realesate
      - key: DB_USERNAME
        value: YOUR_DB_USER
      - key: DB_PASSWORD
        value: YOUR_DB_PASS
